<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoftListR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
            background: var(--md-sys-color-background);
            color: var(--md-sys-color-on-background);
            transition: background 0.3s ease, color 0.2s ease;
        }

        :root {
            --md-sys-color-primary: #1b3bff;
            --md-sys-color-on-primary: #ffffff;
            --md-sys-color-primary-container: #dde0ff;
            --md-sys-color-on-primary-container: #0a1a6e;
            --md-sys-color-background: #fbf8ff;
            --md-sys-color-on-background: #1b1b21;
            --md-sys-color-surface: #fbf8ff;
            --md-sys-color-on-surface: #1b1b21;
            --md-sys-color-surface-variant: #e2e1ec;
            --md-sys-color-on-surface-variant: #45464f;
            --md-sys-color-outline: #767680;
            --md-sys-color-outline-variant: #c5c6d0;
            --md-sys-color-surface-container: #edebf2;
            --md-sys-color-surface-container-high: #e6e5ec;
            --md-sys-color-surface-container-highest: #dad9e0;
        }

        [data-theme="dark"] {
            --md-sys-color-primary: #b9c3ff;
            --md-sys-color-on-primary: #1a2a8a;
            --md-sys-color-primary-container: #0f2b9e;
            --md-sys-color-on-primary-container: #dde0ff;
            --md-sys-color-background: #13131a;
            --md-sys-color-on-background: #e5e2ec;
            --md-sys-color-surface: #13131a;
            --md-sys-color-on-surface: #e5e2ec;
            --md-sys-color-surface-variant: #45464f;
            --md-sys-color-on-surface-variant: #c5c6d0;
            --md-sys-color-outline: #8f909b;
            --md-sys-color-outline-variant: #45464f;
            --md-sys-color-surface-container: #1f1f26;
            --md-sys-color-surface-container-high: #2a2a32;
            --md-sys-color-surface-container-highest: #35353d;
        }

        /* ШАПКА */
        .top-bar {
            width: 100%;
            max-width: 600px;
            padding: 0.8rem 1.2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            background: var(--md-sys-color-surface-container);
            border-radius: 1.5rem;
            border: 1px solid var(--md-sys-color-outline-variant);
            margin-bottom: 1.2rem;
            transition: background 0.3s, border 0.3s;
        }

        .brand-group {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .logo-icon {
            width: 44px;
            height: 44px;
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }
        .brand-name {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--md-sys-color-on-surface);
        }
        .brand-tagline {
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--md-sys-color-on-surface-variant);
            opacity: 0.6;
        }

        .settings-wrapper {
            position: relative;
        }
        .settings-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--md-sys-color-surface-container-high);
            border: 1px solid var(--md-sys-color-outline-variant);
            color: var(--md-sys-color-on-surface-variant);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
        }
        .settings-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            min-width: 180px;
            background: var(--md-sys-color-surface-container);
            border-radius: 1.2rem;
            padding: 1rem 1.2rem;
            border: 1px solid var(--md-sys-color-outline-variant);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px) scale(0.96);
            transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
            z-index: 10;
        }
        .settings-dropdown.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }
        .dropdown-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--md-sys-color-on-surface-variant);
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }
        .theme-switch-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .theme-switch-row span {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--md-sys-color-on-surface);
        }
        .theme-icons {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--md-sys-color-on-surface-variant);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 22px;
            flex-shrink: 0;
            cursor: pointer;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--md-sys-color-surface-container-highest);
            transition: 0.25s;
            border-radius: 40px;
        }
        .slider::before {
            content: "";
            position: absolute;
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background: var(--md-sys-color-surface);
            transition: 0.25s;
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
        }
        .switch input:checked+.slider {
            background: var(--md-sys-color-primary);
        }
        .switch input:checked+.slider::before {
            transform: translateX(18px);
            background: var(--md-sys-color-on-primary);
        }

        /* КАРТОЧКИ */
        .cards {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .card {
            width: 100%;
            background: var(--md-sys-color-surface-container);
            border-radius: 2rem;
            border: 1px solid var(--md-sys-color-outline-variant);
            overflow: hidden;
            transition: background 0.3s, border 0.3s;
        }

        .card-img {
            width: 100%;
            aspect-ratio: 16/9;
            overflow: hidden;
            background: var(--md-sys-color-surface-container-highest);
        }
        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-body {
            padding: 1.2rem 1.4rem 1.4rem;
        }

        .card-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--md-sys-color-on-surface);
        }
        .card-title small {
            font-size: 0.8rem;
            font-weight: 400;
            color: var(--md-sys-color-on-surface-variant);
            opacity: 0.6;
            margin-left: 6px;
        }

        .card-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem 1rem;
            margin: 0.4rem 0 0.6rem;
            font-size: 0.9rem;
            color: var(--md-sys-color-on-surface-variant);
        }
        .card-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .card-meta i {
            font-size: 0.8rem;
            color: var(--md-sys-color-primary);
            opacity: 0.7;
        }

        .card-divider {
            height: 1px;
            background: var(--md-sys-color-outline-variant);
            margin: 0.6rem 0 0.8rem;
        }

        .card-features-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }
        .card-features-title {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--md-sys-color-on-surface-variant);
            opacity: 0.6;
        }

        .toggle-features-btn {
            background: none;
            border: none;
            color: var(--md-sys-color-on-surface-variant);
            cursor: pointer;
            font-size: 0.85rem;
            padding: 0.1rem 0.4rem;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 4px;
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        .toggle-features-btn:hover {
            opacity: 1;
        }
        .toggle-features-btn i {
            transition: transform 0.3s ease;
            font-size: 0.8rem;
        }
        .toggle-features-btn i.rotated {
            transform: rotate(180deg);
        }

        .card-features-wrapper {
            overflow: hidden;
            transition: max-height 0.35s ease, opacity 0.25s ease;
            max-height: 500px;
            opacity: 1;
        }
        .card-features-wrapper.collapsed {
            max-height: 0;
            opacity: 0;
        }

        .card-features {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem 0.6rem;
            padding-top: 0.1rem;
        }
        .card-features .tag {
            font-size: 0.9rem;  /* УВЕЛИЧИЛ ТЕГИ */
            font-weight: 500;
            padding: 0.25rem 0.8rem;
            border-radius: 20px;
            background: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.8rem;
            padding-top: 0.8rem;
            border-top: 1px solid var(--md-sys-color-outline-variant);
        }
        .card-version {
            font-size: 0.85rem;
            color: var(--md-sys-color-on-surface-variant);
            opacity: 0.6;
        }
        .card-version strong {
            color: var(--md-sys-color-on-surface);
            opacity: 0.9;
        }

        .btn-download {
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            border: none;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 0.4rem 1.4rem;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s;
        }
        .btn-download:hover {
            transform: scale(1.05);
        }
        .btn-download i {
            font-size: 0.8rem;
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: var(--md-sys-color-on-surface-variant);
            opacity: 0.4;
            text-align: center;
        }

        @media (max-width: 550px) {
            .top-bar {
                padding: 0.5rem 0.8rem;
                border-radius: 1.2rem;
            }
            .brand-name {
                font-size: 1.2rem;
            }
            .logo-icon {
                width: 36px;
                height: 36px;
                font-size: 18px;
                border-radius: 12px;
            }
            .settings-icon {
                width: 36px;
                height: 36px;
                font-size: 1rem;
            }
            .card-body {
                padding: 0.8rem 1rem 1rem;
            }
            .card-title {
                font-size: 1.1rem;
            }
            .card-meta {
                font-size: 0.8rem;
            }
            .card-features .tag {
                font-size: 0.8rem;  /* На мобилках чуть меньше, но всё равно крупно */
                padding: 0.2rem 0.6rem;
            }
            .btn-download {
                font-size: 0.8rem;
                padding: 0.3rem 1rem;
            }
            .card-version {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <!-- ШАПКА -->
    <div class="top-bar">
        <div class="brand-group">
            <div class="logo-icon"><i class="fas fa-cubes"></i></div>
            <div>
                <span class="brand-name">SoftListR</span>
                <span class="brand-tagline">SoftListR Soft So2</span>
            </div>
        </div>
        <div class="settings-wrapper">
            <div class="settings-icon" id="settingsToggle"><i class="fas fa-sliders-h"></i></div>
            <div class="settings-dropdown" id="settingsDropdown">
                <div class="dropdown-title"><i class="fas fa-palette"></i> Тема</div>
                <div class="theme-switch-row">
                    <span>Тёмная</span>
                    <div class="theme-icons">
                        <i class="fas fa-sun"></i>
                        <label class="switch"><input type="checkbox" id="themeToggle" /><span class="slider"></span></label>
                        <i class="fas fa-moon"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- КАРТОЧКИ -->
    <div class="cards" id="cardsContainer"></div>

    <div class="footer">SoftListR · made with ❤️</div>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js"
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getFirestore, collection, query, orderBy, onSnapshot } from "firebase/firestore";

        const firebaseConfig = {
            apiKey: "AIzaSyDN-yKcm_tekA-5LKhjZozPIFe5LVaoTZ0",
            authDomain: "softlistr-web.firebaseapp.com",
            projectId: "softlistr-web",
            storageBucket: "softlistr-web.firebasestorage.app",
            messagingSenderId: "335161812376",
            appId: "1:335161812376:web:895d66f8cab3168cf537ed",
            measurementId: "G-JCF7MBKHF4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const container = document.getElementById('cardsContainer');

        const builtin = [{
            title: "Чит на Standoff 2 iOS",
            tag: "TrollStore",
            image: "https://i.postimg.cc/PxX2ks7h/IMG-20260824-145617-186.jpg",
            version: "0.39.2",
            requirements: "TrollStore",
            file: "LitvinTap.tipa",
            features: ["Esp", "AimBot", "SlientAim", "TriggerBot", "Hit Maker", "Kill Sound", "HitInfo", "Hit Vignette", "Hit Particles", "Kill Explosion", "Config"]
        }, {
            title: "Esp",
            tag: "Root",
            image: "https://i.postimg.cc/NGzFT8BV/Yi-VOe7CShc-YLx-GPPEfn9Ig.jpg",
            version: "0.39.2",
            requirements: "Root",
            file: "12000000dollarov.sh",
            features: ["Esp", "Esp Box"]
        }];

        function createCard(card) {
            const div = document.createElement('div');
            div.className = 'card';
            const tags = card.features?.length ? card.features.map(f => `<span class="tag">${f}</span>`).join('') : '';
            div.innerHTML = `
                <div class="card-img"><img src="${card.image}" alt="${card.title}" loading="lazy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22500%22 height=%22280%22 viewBox=%220 0 500 280%22%3E%3Crect width=%22500%22 height=%22280%22 fill=%22%23ddd%22/%3E%3Ctext x=%22250%22 y=%22145%22 text-anchor=%22middle%22 fill=%22%23999%22 font-size=%2230%22 font-family=%22sans-serif%22%3E📷%3C/text%3E%3C/svg%3E'" /></div>
                <div class="card-body">
                    <div class="card-title">${card.title}${card.tag ? `<small>• ${card.tag}</small>` : ''}</div>
                    <div class="card-meta"><span><i class="fas fa-tag"></i> ${card.version}</span><span><i class="fas fa-microchip"></i> ${card.requirements}</span></div>
                    <div class="card-divider"></div>
                    <div class="card-features-header">
                        <div class="card-features-title"><i class="fas fa-list-ul"></i> Функции</div>
                        <button class="toggle-features-btn"><span class="toggle-label">Скрыть</span><i class="fas fa-chevron-up toggle-icon"></i></button>
                    </div>
                    <div class="card-features-wrapper"><div class="card-features">${tags}</div></div>
                    <div class="card-footer">
                        <span class="card-version">↑ <strong>${card.version}</strong></span>
                        <a href="${card.file}" download class="btn-download"><i class="fas fa-download"></i> Скачать</a>
                    </div>
                </div>
            `;
            return div;
        }

        builtin.forEach(c => container.appendChild(createCard(c)));

        const q = query(collection(db, "cards"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            document.querySelectorAll('.firebase-card').forEach(el => el.remove());
            snapshot.forEach((doc) => {
                const card = { id: doc.id, ...doc.data() };
                const el = createCard(card);
                el.classList.add('firebase-card');
                container.appendChild(el);
            });
        });

        // ТОГГЛ
        container.addEventListener('click', function(e) {
            const btn = e.target.closest('.toggle-features-btn');
            if (!btn) return;
            const wrapper = btn.closest('.card-body').querySelector('.card-features-wrapper');
            const label = btn.querySelector('.toggle-label');
            const icon = btn.querySelector('.toggle-icon');
            if (!wrapper) return;
            const collapsed = wrapper.classList.contains('collapsed');
            if (collapsed) {
                wrapper.classList.remove('collapsed');
                if (label) label.textContent = 'Скрыть';
                if (icon) icon.classList.remove('rotated');
            } else {
                wrapper.classList.add('collapsed');
                if (label) label.textContent = 'Показать';
                if (icon) icon.classList.add('rotated');
            }
        });

        // ТЕМА
        const toggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        const settingsIcon = document.getElementById('settingsToggle');
        const dropdown = document.getElementById('settingsDropdown');

        const saved = localStorage.getItem('theme');
        if (saved === 'dark') {
            html.setAttribute('data-theme', 'dark');
            toggle.checked = true;
        }

        toggle.addEventListener('change', function() {
            const theme = this.checked ? 'dark' : 'light';
            html.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
        });

        settingsIcon.addEventListener('click', function(e) {
            e.stopPropagation();
            dropdown.classList.toggle('open');
        });

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.settings-wrapper')) {
                dropdown.classList.remove('open');
            }
        });
    </script>
</body>
                    </html>
